metadata:
  name: Android Hooks for Testing
  version: 1
  author: frooky dev
  platform: Android

# global settings for the hooks in this hook file.
settings:
  hookSettings:
    stackTraceLimit: 5               # Sets stackTraceLimit to 10 for all hooks
    # stackTraceFilter: ['^(?!android).*']   # Stack trace filters to apply.
  decoderSettings:
    fastDecode: true                  # If set, the decoders are instructed to 
# prioritize speed over details. Mostly, this mean avoiding expensive Frida <-> 
# native roundtrip.
    magicDecode: true                 # If set, frooky tries to guess the type 
# of a value in case it is not declared in the hook, or it is not possible to 
# deduct it at runtime
    maxRecursion: 1                   # Sets the cutoff limit for the recursion 
# depth when decoding nested data structures, such as nested arrays, lists, sets, 
# maps, structs etc.
    decodeLimit: 11                   # Sets the limit of how many elements of a
# enumerable data structures, such as arrays, lists, dictionaries etc. are 
# decoded

hookGroup:
  # java primitive types
  - javaClass: org.owasp.mastestapp.MastgTest
    hooks:
    - receiveBoolean
    - receiveByte
    - receiveShort
    - method: receiveInt
      overloads:
      - params:
        - [int, integer, {decodeLimit: 10, filter:[2147483647, 23]}]
    - receiveLong
    - receiveFloat
    - receiveDouble
    - receiveChar

  # java types which are converted to "string" type in javascript
  - javaClass: org.owasp.mastestapp.MastgTest
    hooks:
    - method: receiveString
      overloads:
      - params:
        - [java.lang.String, receivedString, {decodeLimit: 10}]


  # primitive java arrays
  - javaClass: org.owasp.mastestapp.MastgTest
    hookSettings:
      stackTraceLimit: 5
    decoderSettings:
      fastDecode: false
      magicDecode: false
      maxRecursion: 5
      decodeLimit: 5
    hooks:
    - receiveStringArray
    - receiveBooleanArray
    - receiveByteArray
    - receiveShortArray
    - method: receiveIntArray
      overloads:
      - params:
        - ["[I", receivedInteger, { decodeLimit: 50 }]
    - receiveIntArray
    - receiveLongArray
    - receiveFloatArray
    - receiveDoubleArray
    - receiveCharArray
    - receiveNestedPrimitivesArray
    - receiveNestedObjectArray

  # complex common java types
  - javaClass: org.owasp.mastestapp.MastgTest
    hooks:
    - receiveBigInteger
    - receiveBigDecimal
    - receiveList
    - receiveMap
    - receiveSet
    - receiveEnum

  - javaClass: androidx.security.crypto.EncryptedSharedPreferences$Editor
    hooks:
    - putString
    - putStringSet

  # 3 different overloads with different ways of param declaration 
  - javaClass: android.content.Intent 
    hooks:
    - method: $init
      overloads:
      - params:
        - android.content.Intent
      - params: 
        - [ android.content.Context, packageContext]
        - [ java.lang.Class, cls]
      - params:
        - { type: java.lang.String, name: action}
        - android.net.Uri

  - javaClass: android.content.Intent 
    hooks:
    - method: setFlags
      overloads:
      - params:
        - [int, flags, { customDecoder: android.content.IntentFlagDecoder }]

  - javaClass: java.security.KeyPairGenerator
    hooks:
    - method: initialize
      overloads:
      - params: 
        - [java.security.spec.AlgorithmParameterSpec, params]

  - javaClass: android.app.Activity 
    hooks:
    - startActivity

  - module: libcrypto.so
    hooks:
    - X509_new
    - symbol: RSA_parse_public_key
    - EVP_EncryptUpdate
    - HMAC
    - RSA_public_encrypt
    - EVP_DecryptUpdate
    - EVP_DigestUpdate


# decode arguments passed by value
  - module: libreceiveFundamentalValue.so
    hooks:
    - symbol: receive_bool
      retType: bool
      params:
      - [bool, falseBool]
      - [bool, trueBool]
    - symbol: receive_char
      retType: char
      params:
      - [char, minAscii]
      - [char, maxAscii]
    - symbol: receive_schar
      retType: schar
      params:
      - [schar, minSchar]
      - [schar, maxSchar]
    - symbol: receive_uchar
      retType: uchar
      params:
      - [uchar, minUchar]
      - [uchar, maxUchar]
    - symbol: receive_short
      retType: short
      params:
      - [short, minShort]
      - [short, maxShort]
    - symbol: receive_ushort
      retType: ushort
      params:
      - [ushort, minUshort]
      - [ushort, maxUshort]
    - symbol: receive_int
      retType: int
      params:
      - [int, minInt]
      - [int, maxInt]
    - symbol: receive_uint
      retType: uint
      params:
      - [uint, minUint]
      - [uint, maxUint]
    - symbol: receive_long
      retType: long
      params:
      - [long, minLong]
      - [long, maxLong]
    - symbol: receive_ulong
      retType: ulong
      params:
      - [ulong, minUlong]
      - [ulong, maxUlong]
    - symbol: receive_llong
      retType: llong
      params:
      - [llong, minLlong]
      - [llong, maxLlong]
    - symbol: receive_ullong
      retType: ullong
      params:
      - [ullong, minUllong]
      - [ullong, maxUllong]
    - symbol: receive_float
      retType: float
      params:
      - [float, minFloat]
      - [float, maxFloat]
    - symbol: receive_double
      retType: double
      params:
      - [double, minDouble]
      - [double, maxDouble]


# decode arguments passed by reference
  - module: libreceiveFundamentalReference.so
    hooks:
    - symbol: receive_bool_ref
      retType: bool*
      params:
      - [bool*, falseBoolRef]
      - [bool*, trueBoolRef]
    - symbol: receive_char_ref
      retType: char*
      params:
      - [char*, minAsciiRef]
      - [char*, maxAsciiRef]
    - symbol: receive_schar_ref
      retType: schar*
      params:
      - [schar*, minScharRef]
      - [schar*, maxScharRef]
    - symbol: receive_uchar_ref
      retType: uchar*
      params:
      - [uchar*, minUcharRef]
      - [uchar*, maxUcharRef]
    - symbol: receive_short_ref
      retType: short*
      params:
      - [short*, minShortRef]
      - [short*, maxShortRef]
    - symbol: receive_ushort_ref
      retType: ushort*
      params:
      - [ushort*, minUshortRef]
      - [ushort*, maxUshortRef]
    - symbol: receive_int_ref
      retType: int*
      params:
      - [int*, minIntRef]
      - [int*, maxIntRef]
    - symbol: receive_uint_ref
      retType: uint*
      params:
      - [uint*, minUintRef]
      - [uint*, maxUintRef]
    - symbol: receive_long_ref
      retType: long*
      params:
      - [long*, minLongRef]
      - [long*, maxLongRef]
    - symbol: receive_ulong_ref
      retType: ulong*
      params:
      - [ulong*, minUlongRef]
      - [ulong*, maxUlongRef]
    - symbol: receive_llong_ref
      retType: llong*
      params:
      - [llong*, minLlongRef]
      - [llong*, maxLlongRef]
    - symbol: receive_ullong_ref
      retType: ullong*
      params:
      - [ullong*, minUllongRef]
      - [ullong*, maxUllongRef]
    - symbol: receive_float_ref
      retType: float*
      params:
      - [float*, minFloatRef]
      - [float*, maxFloatRef]
    - symbol: receive_double_ref
      retType: double*
      params:
      - [double*, minDoubleRef]
      - [double*, maxDoubleRef]

# decode argument: null terminated string 
  - module: libreceiveString.so
    decoderSettings:
      magicDecode: false
    hooks:
    - symbol: receive_cstring
      params:
      - [char *, string]
    - symbol: receive_utf8
      params:
      - [ char *, {direction: inout}]

  # use parameter to decode a native uchar *
  - module: libreceiveFundamentalReference.so
    hooks:
    - symbol: receive_byte_array
      params:
      - [unsigned char *, data, { decoderArg: length , direction: inout } ]
      - [int, length]

# decode argument: null terminated string 
  - module: libreceiveString.so
    hookSettings:
      stackTraceLimit: 10
    decoderSettings:
      magicDecode: false
    hooks:
    - symbol: receive_cstring
      params: 
      - [char *, string]
    - symbol: receive_utf8
      params: 
      - [char *, string]

  # Hook with named parameters (names provide context in output).
  # Docs: https://www.man7.org/linux/man-pages/man2/open.2.html
  - module: libc.so
    hookSettings:
      stackTraceLimit: 10
      stackTraceFilter: ['^org\.owasp\.mastestapp']
    hooks:
    - symbol: open
      retType: int
      params:
      - [const char *, path, { paramFilter: ['^/sdcard', '^/storage/emulated']}]
      - [int, flags]
      - [mode_t, mode]